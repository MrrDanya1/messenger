<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Green Messenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07130e;color:#e9fff2;font:15px system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.wrap{min-height:100vh;display:grid;place-items:center;padding:16px}.card{width:min(430px,100%);background:#0d2118;border:1px solid #1c4933;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0008}.logo{font-size:28px;font-weight:800;margin-bottom:18px;color:#5dff9a}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,.ghost{background:#143523;color:#bfffd3;padding:10px 14px;border-radius:12px}.tabs .on{background:#20b968;color:white}.field{margin:10px 0}.field input{width:100%;padding:13px;border-radius:12px;border:1px solid #28563d;background:#081810;color:white;outline:0}.primary{width:100%;padding:13px;border-radius:12px;background:#20b968;color:white;font-weight:700}.muted{color:#91ad9c;font-size:13px}.err{color:#ff8e8e;margin:10px 0}.app{height:100vh;display:grid;grid-template-columns:330px 1fr}.side{border-right:1px solid #173a29;background:#0a1b13;display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid #173a29}.top b{font-size:22px;color:#5dff9a}.search{margin-top:12px;width:100%;padding:11px;border-radius:12px;border:1px solid #28563d;background:#081810;color:white}.users{position:absolute;top:104px;left:18px;right:18px;background:#102a1d;border:1px solid #28563d;border-radius:12px;z-index:3;max-height:220px;overflow:auto}.user{padding:11px;display:flex;gap:10px;align-items:center}.user:hover,.chat:hover{background:#123522}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#20b968;color:white;font-weight:700;flex:none}.chat{padding:13px 18px;display:flex;gap:11px;align-items:center;border-bottom:1px solid #102a1e}.chat b{display:block}.chat small{color:#779786}.main{display:flex;flex-direction:column;min-width:0}.head{height:68px;padding:12px 18px;border-bottom:1px solid #173a29;display:flex;align-items:center;gap:12px}.back{display:none;background:none;color:#5dff9a;font-size:22px}.msgs{flex:1;overflow:auto;padding:18px}.bubble{max-width:75%;padding:10px 13px;margin:7px 0;border-radius:16px;background:#143523;white-space:pre-wrap;overflow-wrap:anywhere}.mine{margin-left:auto;background:#20b968}.time{font-size:10px;opacity:.7;margin-top:3px}.send{display:flex;gap:8px;padding:12px;border-top:1px solid #173a29}.send input{flex:1;padding:13px;border-radius:14px;border:1px solid #28563d;background:#081810;color:white}.send button{width:48px;border-radius:14px;background:#20b968;color:white}.empty{margin:auto;text-align:center;color:#718e7d}.hidden{display:none!important}@media(max-width:700px){.app{display:block}.side{height:100vh}.main{display:none;height:100vh}.app.chat-open .side{display:none}.app.chat-open .main{display:flex}.back{display:block}}
</style></head><body>
<div id="auth" class="wrap"><div class="card"><div class="logo">Green Messenger</div><h2 style="margin:0 0 10px">Вход через Telegram</h2><p class="muted">Нажми кнопку ниже, открой бота и подтверди вход.</p><button id="tgLogin" class="primary" style="margin:20px 0;min-height:52px;font-size:16px">🔐 Войти через Telegram</button>
<div id="loginStatus" class="muted" style="line-height:1.5"></div><div id="err" class="err"></div><p class="muted">Аккаунт создаётся автоматически после подтверждения Telegram.</p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="top"><b>Сообщения</b><input id="search" class="search" placeholder="Найти пользователя"><div id="users" class="users hidden"></div></div><div id="chats"></div><div style="margin-top:auto;padding:14px"><button id="logout" class="ghost">Выйти</button></div></aside>
<main class="main"><header class="head"><button id="back" class="back">‹</button><div id="title"><b>Выберите чат</b></div></header><div id="msgs" class="msgs"><div class="empty">Начните новый чат через поиск</div></div><form id="send" class="send hidden"><input id="text" maxlength="5000" placeholder="Сообщение..."><button>➤</button></form></main></div>
<script>
const URL='https://ckcfxpaacogrwhimprhj.supabase.co',KEY='sb_publishable_BpY9Xd2oNA-dAP0O_5jYvQ_ljhgUsVm';
const db=supabase.createClient(URL,KEY);let user=null,current=null,channel=null;
const $=id=>document.getElementById(id), initials=s=>(s||'?').trim().slice(0,1).toUpperCase();
function err(x){$('err').textContent=x||''}
let loginTimer=null;
async function beginTelegramLogin(){
  err(''); $('tgLogin').disabled=true; $('loginStatus').textContent='Создаём безопасную сессию…';
  try{
    const r=await fetch(URL+'/functions/v1/telegram-bot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start'})});
    const j=await r.json();
    if(!r.ok||!j.id) throw new Error(j.error||'Не удалось создать сессию');
    localStorage.setItem('tg_login_session',j.id);
    $('loginStatus').textContent='Открываем @I6767bot…';
    location.href='https://t.me/I6767bot?start='+encodeURIComponent(j.id);
  }catch(e){
    $('tgLogin').disabled=false;
    err(e.message||'Ошибка запуска регистрации');
    $('loginStatus').textContent='';
  }
}
async function checkTelegramLogin(){
  const id=localStorage.getItem('tg_login_session');
  if(!id) return;
  $('tgLogin').disabled=true;
  $('loginStatus').textContent='Ожидаем подтверждение в @I6767bot…';
  if(loginTimer) clearInterval(loginTimer);
  const check=async()=>{
    try{
      const s=await fetch(URL+'/functions/v1/telegram-bot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',id})});
      const x=await s.json();
      if(x.status==='approved'){
        clearInterval(loginTimer); localStorage.removeItem('tg_login_session');
        $('loginStatus').textContent='Регистрация подтверждена. Входим…';
        const a=await db.auth.signInWithPassword({email:x.email,password:x.password});
        if(a.error){$('tgLogin').disabled=false;return err(a.error.message)}
      }else if(x.status==='expired'){
        clearInterval(loginTimer);localStorage.removeItem('tg_login_session');
        $('tgLogin').disabled=false;$('loginStatus').textContent='Сессия истекла. Нажми кнопку ещё раз.';
      }
    }catch(e){}
  };
  await check(); loginTimer=setInterval(check,1500);
}
$('tgLogin').onclick=beginTelegramLogin;
async function start(){let r=await db.auth.getUser();user=r.data.user;if(!user)return;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadChats()}
db.auth.onAuthStateChange((_e,s)=>{if(s)start()});
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function loadChats(){let m=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(m.error)return;let ids=m.data.map(x=>x.conversation_id);$('chats').innerHTML='';if(!ids.length)return;let cs=await db.from('conversations').select('id,created_at').in('id',ids).order('created_at',{ascending:false});for(const c of cs.data||[]){let ms=await db.from('conversation_members').select('user_id').eq('conversation_id',c.id);let other=(ms.data||[]).find(x=>x.user_id!==user.id);if(!other)continue;let p=await db.from('profiles').select('display_name,username').eq('id',other.user_id).single();let el=document.createElement('div');el.className='chat';el.innerHTML='<div class="avatar">'+initials(p.data?.display_name)+'</div><div><b></b><small></small></div>';el.querySelector('b').textContent=p.data?.display_name||p.data?.username||'Пользователь';el.querySelector('small').textContent='@'+(p.data?.username||'');el.onclick=()=>openChat(c.id,other.user_id,p.data);$('chats').appendChild(el)}}
$('search').oninput=async()=>{let q=$('search').value.trim();if(!q){$('users').classList.add('hidden');return}let r=await db.from('profiles').select('id,username,display_name').neq('id',user.id).or('username.ilike.%'+q+'%,display_name.ilike.%'+q+'%').limit(10);$('users').innerHTML='';for(const p of r.data||[]){let el=document.createElement('div');el.className='user';el.innerHTML='<div class="avatar">'+initials(p.display_name)+'</div><div><b></b><small></small></div>';el.querySelector('b').textContent=p.display_name;el.querySelector('small').textContent='@'+p.username;el.onclick=()=>newChat(p);$('users').appendChild(el)}$('users').classList.remove('hidden')};
async function newChat(p){$('users').classList.add('hidden');$('search').value='';let mm=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);for(const x of mm.data||[]){let q=await db.from('conversation_members').select('user_id').eq('conversation_id',x.conversation_id);if((q.data||[]).some(v=>v.user_id===p.id))return openChat(x.conversation_id,p.id,p)}let c=await db.from('conversations').insert({}).select().single();if(c.error)return alert(c.error.message);await db.from('conversation_members').insert([{conversation_id:c.data.id,user_id:user.id},{conversation_id:c.data.id,user_id:p.id}]);await loadChats();openChat(c.data.id,p.id,p)}
async function openChat(id,other,p){current={id,other};$('title').innerHTML='';let b=document.createElement('b');b.textContent=p?.display_name||'Чат';$('title').appendChild(b);$('msgs').innerHTML='';$('send').classList.remove('hidden');$('app').classList.add('chat-open');let r=await db.from('messages').select('id,sender_id,content,created_at').eq('conversation_id',id).order('created_at');for(const m of r.data||[])addMsg(m);if(channel)db.removeChannel(channel);channel=db.channel('chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},payload=>{if(payload.new.sender_id!==user.id)addMsg(payload.new)}).subscribe()}
function addMsg(m){let el=document.createElement('div');el.className='bubble '+(m.sender_id===user.id?'mine':'');let body=document.createElement('div');body.textContent=m.content;let t=document.createElement('div');t.className='time';t.textContent=new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});el.append(body,t);$('msgs').appendChild(el);$('msgs').scrollTop=$('msgs').scrollHeight}
$('send').onsubmit=async e=>{e.preventDefault();if(!current||!$('text').value.trim())return;let content=$('text').value.trim();let r=await db.from('messages').insert({conversation_id:current.id,sender_id:user.id,content}).select().single();if(r.error)return alert(r.error.message);addMsg(r.data);$('text').value=''};
$('back').onclick=()=>{$('app').classList.remove('chat-open');if(channel){db.removeChannel(channel);channel=null}};
start();
checkTelegramLogin();
</script></body></html>
